apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      securityContext:
        fsGroup: 1000

      containers:
      - name: sonarqube
        image: sonarqube:lts-community

        securityContext:
          runAsUser: 1000
          runAsGroup: 1000

        ports:
        - containerPort: 9000

        env:
        - name: SONAR_ES_BOOTSTRAP_CHECKS_DISABLE
          value: "true"

        volumeMounts:
        - name: sonarqube-storage
          mountPath: /opt/sonarqube/data

      volumes:
      - name: sonarqube-storage
        persistentVolumeClaim:
          claimName: sonarqube-pvc