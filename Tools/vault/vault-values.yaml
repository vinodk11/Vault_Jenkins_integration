global:
  enabled: true

injector:
  enabled: true
  replicas: 2

ui:
  enabled: true
  serviceType: ClusterIP

server:
  image:
    repository: hashicorp/vault
    tag: "1.19.0"

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  extraEnvironmentVars:
    VAULT_LOG_LEVEL: info

  dataStorage:
    enabled: true
    storageClass: gp3
    accessMode: ReadWriteOnce
    size: 20Gi

  service:
    enabled: true
    type: ClusterIP

  ha:
    enabled: true
    replicas: 3

    raft:
      enabled: true

      config: |
        ui = true

        listener "tcp" {
          address = "0.0.0.0:8200"
          cluster_address = "0.0.0.0:8201"
          tls_disable = 1
        }

        storage "raft" {
          path = "/vault/data"

          retry_join {
            leader_api_addr = "http://vault-0.vault-internal:8200"
          }

          retry_join {
            leader_api_addr = "http://vault-1.vault-internal:8200"
          }

          retry_join {
            leader_api_addr = "http://vault-2.vault-internal:8200"
          }
        }

        service_registration "kubernetes" {}